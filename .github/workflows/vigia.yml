name: vigia

on:
  schedule:
    - cron: "0,30 9-20 * * *" # a cada 30 min, 06:00 a 17:30 de Brasília (o GitHub pode atrasar alguns minutos)
    - cron: "0 21 * * *"      # 18:00 de Brasília (fecha a janela 06:00-18:00)
  workflow_dispatch: {}          # botão "Run workflow" na aba Actions
  push:
    paths: ["vigia.py", ".github/workflows/vigia.yml"]

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Coletar voos
        run: python3 vigia.py
      - name: Guardar no repositório
        run: |
          git config user.name "vigia"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "voos $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push
